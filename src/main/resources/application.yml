server:
  port: 8765
  forward-headers-strategy: framework

spring:
  application:
    name: apigateway

  cloud:
    serviceregistry:
      auto-registration:
        enabled: true

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: login-service-docs
              uri: lb://olx-login
              predicates:
                - Path=/v3/api-docs/login
              filters:
                - RewritePath=/v3/api-docs/login, /olx/v3/api-docs

            - id: advertise-service-docs
              uri: lb://olx-advertise
              predicates:
                - Path=/v3/api-docs/advertise
              filters:
                - RewritePath=/v3/api-docs/advertise, /v3/api-docs

            - id: masterdata-service-docs
              uri: lb://olx-masterdata
              predicates:
                - Path=/v3/api-docs/masterdata
              filters:
                - RewritePath=/v3/api-docs/masterdata, /v3/api-docs

            - id: olx-login-public-authenticate
              uri: lb://olx-login
              predicates:
                - Path=/gateway/user/authenticate
              filters:
                - RewritePath=/gateway/(?<segment>.*), /olx/${segment}

            - id: olx-login-public-register
              uri: lb://olx-login
              predicates:
                - Path=/gateway/user
                - Method=POST
              filters:
                - RewritePath=/gateway/(?<segment>.*), /olx/${segment}

            - id: olx-advertise-user
              uri: lb://olx-advertise
              predicates:
                - Path=/gateway/user/advertise/**
              filters:
                - RewritePath=/gateway/(?<segment>.*), /${segment}
                - JwtAuthenticationFilter

            - id: olx-advertise
              uri: lb://olx-advertise
              predicates:
                - Path=/gateway/advertise/**
              filters:
                - RewritePath=/gateway/(?<segment>.*), /${segment}
                - JwtAuthenticationFilter

            - id: olx-login-protected
              uri: lb://olx-login
              predicates:
                - Path=/gateway/user/**
              filters:
                - RewritePath=/gateway/(?<segment>.*), /olx/${segment}
                - JwtAuthenticationFilter

            - id: olx-masterdata
              uri: lb://olx-masterdata
              predicates:
                - Path=/gateway/masterdata/**
              filters:
                - RewritePath=/gateway/masterdata/(?<segment>.*), /advertise/${segment}
                - JwtAuthenticationFilter

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: sushg12

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.sushma.apigateway: DEBUG

# ── Swagger UI ────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: login-service
        url: /v3/api-docs/login

      - name: advertise-service
        url: /v3/api-docs/advertise

      - name: masterdata-service
        url: /v3/api-docs/masterdata
    enabled: true
    disable-swagger-default-url: true
  api-docs:
    enabled: true
    path: /v3/api-docs
    resolve-schema-properties: true
  override-with-generic-response: false